<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Колхоз — списания</title><style>body{font:16px Arial;max-width:950px;margin:20px auto;padding:12px;background:#f5f6f8}section{background:white;padding:20px;border-radius:12px;margin:15px 0}input,select,button{padding:10px;margin:5px;max-width:100%}table{width:100%}td{padding:5px}h1{margin:8px}button{cursor:pointer}</style><h1>Колхоз · Списания</h1><p>Тестовый интерфейс. Пока данные сохраняются на этом устройстве, не в общей базе.</p><section><label>Дата <input id="date" type="date"></label><label>Смена <select id="shift"><option>День</option><option>Ночь</option><option>Кондитерка</option></select></label><label>Ответственный <input id="person" placeholder="ФИО"></label><label>Склад <input id="warehouse"></label><label>Статья <select id="reason"><option>Порча</option><option>Брак</option><option>Питание персонала</option><option>Недостача</option><option>Прочее</option></select></label><h3>Номенклатура</h3><input type="file" id="file" accept=".xlsx,.xls"><button onclick="addItem()">Добавить товар вручную</button><datalist id="catalog"></datalist><table><thead><tr><th>Товар</th><th>Количество</th><th></th></tr></thead><tbody id="items"></tbody></table><button onclick="addRow()">+ Строка</button><button onclick="save()">Сохранить</button><button onclick="exportXlsx()">Скачать Excel</button><p id="message"></p></section><section><h3>Журнал на этом устройстве</h3><div id="history"></div></section><script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script><script src="writeoffs.js"></script>
